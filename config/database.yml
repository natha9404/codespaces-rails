default: &default
  adapter: postgresql
  host: localhost
  port: 5433
  username: postgres
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: notif_demo_development

test:
  <<: *default
  database: notif_demo_test

production:
  primary: &primary_production
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>